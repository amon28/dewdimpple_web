<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bedrock Model Viewer</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="dropOverlay" class="drop-overlay hidden">
    <div class="drop-overlay-inner">Drop a resource pack (.zip / .mcpack) to import</div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Bedrock Model Viewer</span>
      <span id="packName" class="pack-name"></span>
    </div>

    <div class="topbar-actions">
      <button id="btnImport" class="btn">Import Pack…</button>
      <input id="fileImport" type="file" accept=".zip,.mcpack" hidden />
      <button id="btnDemo" class="btn btn-ghost">Load Demo Pack</button>
      <div class="export-group">
        <input id="exportName" class="export-name" type="text" placeholder="output name" />
        <button id="btnExport" class="btn btn-primary" disabled>Export Pack ⬇</button>
      </div>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <div class="tabs">
        <button class="tab active" data-tab="entities">Entities <span id="countEntities" class="count"></span><span id="entityIssueBadge" class="issue-badge hidden"></span></button>
        <button class="tab" data-tab="models">Models <span id="countModels" class="count"></span></button>
        <button class="tab" data-tab="textures">Textures <span id="countTextures" class="count"></span></button>
      </div>

      <div class="tab-panel" id="panel-entities">
        <!-- list view -->
        <div id="entityListView">
          <div class="panel-toolbar">
            <input id="searchEntities" class="search" type="search" placeholder="Filter entities…" />
          </div>
          <div id="listEntities" class="file-list"></div>
        </div>

        <!-- detail view for one entity (or the "ungrouped files" bucket) -->
        <div id="entityDetailView" class="hidden">
          <div class="entity-detail-header">
            <button id="btnEntityBack" class="btn btn-small">&larr; All entities</button>
          </div>
          <div class="entity-detail-title">
            <div id="entityDetailIdentifier" class="entity-detail-identifier"></div>
            <div id="entityDetailPath" class="entity-detail-path"></div>
          </div>
          <div id="entityIssues" class="entity-issues"></div>

          <div class="entity-section-header">Models</div>
          <div id="entityModelsList" class="file-list entity-sublist"></div>

          <div class="entity-section-header">Textures</div>
          <div id="entityTexturesList" class="file-list texture-grid entity-sublist"></div>
        </div>
      </div>

      <div class="tab-panel hidden" id="panel-models">
        <div class="panel-toolbar">
          <input id="searchModels" class="search" type="search" placeholder="Filter models…" />
          <button id="btnAddModel" class="btn btn-small" title="Add a new model file">+ Add</button>
        </div>
        <div id="listModels" class="file-list"></div>
      </div>

      <div class="tab-panel hidden" id="panel-textures">
        <div class="panel-toolbar">
          <input id="searchTextures" class="search" type="search" placeholder="Filter textures…" />
          <button id="btnAddTexture" class="btn btn-small" title="Add a new texture file">+ Add</button>
        </div>
        <div id="listTextures" class="file-list texture-grid"></div>
      </div>

      <p class="sidebar-hint">Everything runs locally in your browser — your resource pack is never uploaded anywhere.</p>
    </aside>

    <main class="viewport">
      <div class="viewer-toolbar">
        <div class="selection-summary">
          <span class="selection-label">Model:</span>
          <select id="selectModel" class="select"><option value="">— none —</option></select>
          <span class="selection-label">Texture:</span>
          <select id="selectTexture" class="select"><option value="">— none —</option></select>
        </div>

        <div class="camera-presets">
          <button class="btn btn-small" data-cam="front">Front</button>
          <button class="btn btn-small" data-cam="back">Back</button>
          <button class="btn btn-small" data-cam="left">Left</button>
          <button class="btn btn-small" data-cam="right">Right</button>
          <button class="btn btn-small" data-cam="top">Top</button>
          <button class="btn btn-small" data-cam="bottom">Bottom</button>
          <button class="btn btn-small" data-cam="iso">Iso</button>
          <button id="btnFrame" class="btn btn-small" title="Fit view to model">Fit ⤢</button>
        </div>

        <div class="view-toggles">
          <label><input type="checkbox" id="toggleGrid" checked /> Grid</label>
          <label><input type="checkbox" id="toggleAxes" /> Axes</label>
          <label><input type="checkbox" id="toggleWireframe" /> Wireframe</label>
          <label class="bg-toggle">
            BG
            <select id="selectBg" class="select select-small">
              <option value="0x20232a">Dark</option>
              <option value="0xeceff4">Light</option>
              <option value="0x000000">Black</option>
              <option value="0x2b6cb0">Blue</option>
            </select>
          </label>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="viewerEmpty" class="viewer-empty">
          <p>Import a resource pack to get started, or try the bundled demo pack.</p>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Item template used by ui.js for both model and texture rows -->
  <template id="tmplFileRow">
    <div class="file-row">
      <img class="file-thumb" hidden />
      <div class="file-info">
        <div class="file-name"></div>
        <div class="file-path"></div>
      </div>
      <div class="file-actions">
        <button class="row-btn row-view" title="View">View</button>
        <button class="row-btn row-replace" title="Replace file">Replace</button>
        <button class="row-btn row-remove" title="Remove file">✕</button>
      </div>
      <input class="row-file-input" type="file" hidden />
    </div>
  </template>

  <!-- JSZip is a UMD build; load as a classic script so window.JSZip exists -->
  <script src="vendor/jszip/jszip.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.min.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="src/app.js"></script>
</body>
</html>
